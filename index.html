<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>arsenal // command reference</title>
<meta name="description" content="A fast offensive-security command reference. Type to filter, press Enter to copy.">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="assets/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #0d1117;
    --bg-raised: #151b23;
    --bg-hover:  #1c2330;
    --line:      #232c3b;
    --line-soft: #1a212c;
    --ink:       #e6edf3;
    --ink-dim:   #8b98a9;
    --ink-faint: #5a6675;
    --amber:     #e3b341;
    --amber-dim: #9e7c2e;
    --match:     #56d4dd;
    --sev:       #f0883e;
    --radius:    7px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 5rem;
  }

  ::selection { background: rgba(86,212,221,0.25); }

  /* ---------- Header ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(13,17,23,0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }

  .head-inner {
    max-width: 1080px;
    margin: 0 auto;
    padding: 1.15rem 1.5rem 1.25rem;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 1rem;
  }

  .brand .logo {
    width: 34px;
    height: 34px;
    border-radius: 8px;
    flex: none;
    box-shadow: 0 0 0 1px var(--line), 0 2px 8px rgba(0,0,0,0.45);
  }

  .brand .prompt {
    font-family: 'JetBrains Mono', monospace;
    color: var(--amber);
    font-weight: 700;
    font-size: 1.3rem;
  }

  .brand .prompt::before {
    content: '~/';
    color: var(--ink-faint);
    font-weight: 400;
  }

  .brand .cursor {
    display: inline-block;
    width: 9px;
    height: 1.15rem;
    background: var(--amber);
    transform: translateY(2px);
    animation: blink 1.15s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .brand .tag {
    margin-left: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    color: var(--ink-faint);
  }

  /* ---------- Search ---------- */
  .search-wrap { position: relative; }

  #search {
    width: 100%;
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    color: var(--ink);
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.05rem;
    padding: 0.9rem 1rem 0.9rem 2.6rem;
    transition: border-color 0.12s, box-shadow 0.12s;
  }
  #search::placeholder { color: var(--ink-faint); }
  #search:focus {
    outline: none;
    border-color: var(--amber-dim);
    box-shadow: 0 0 0 3px rgba(227,179,65,0.08);
  }

  .search-wrap .glyph {
    position: absolute;
    left: 1rem;
    top: 50%;
    transform: translateY(-50%);
    color: var(--amber);
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    pointer-events: none;
  }

  .search-meta {
    position: absolute;
    right: 0.9rem;
    top: 50%;
    transform: translateY(-50%);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    color: var(--ink-faint);
    pointer-events: none;
  }

  /* ---------- Category filter ---------- */
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    margin-top: 0.9rem;
  }

  .chip {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    color: var(--ink-dim);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 100px;
    padding: 0.28rem 0.7rem;
    cursor: pointer;
    transition: all 0.12s;
    white-space: nowrap;
  }
  .chip:hover { color: var(--ink); border-color: var(--line); background: var(--bg-hover); }
  .chip[aria-pressed="true"] {
    color: var(--bg);
    background: var(--amber);
    border-color: var(--amber);
    font-weight: 500;
  }

  /* ---------- Layout ---------- */
  main {
    max-width: 1080px;
    margin: 0 auto;
    padding: 1.75rem 1.5rem 0;
  }

  .cat-group { margin-bottom: 2.25rem; }

  .cat-head {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    margin-bottom: 0.9rem;
    padding-bottom: 0.5rem;
    border-bottom: 1px solid var(--line-soft);
  }
  .cat-head h2 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.95rem;
    font-weight: 500;
    color: var(--amber);
    letter-spacing: 0.02em;
  }
  .cat-head h2::before { content: '// '; color: var(--ink-faint); }
  .cat-head .count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    color: var(--ink-faint);
  }

  /* ---------- Command row ---------- */
  .row {
    border: 1px solid var(--line-soft);
    border-radius: var(--radius);
    background: var(--bg-raised);
    margin-bottom: 0.55rem;
    overflow: hidden;
    transition: border-color 0.12s;
  }
  .row:focus-within,
  .row.kb-active { border-color: var(--amber-dim); }

  .row-main {
    display: flex;
    align-items: stretch;
    gap: 0;
  }

  .cmd-block {
    flex: 1;
    min-width: 0;
    padding: 0.85rem 1rem;
    cursor: pointer;
  }

  .cmd-line {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.92rem;
    font-weight: 500;
    color: var(--ink);
    white-space: pre-wrap;
    word-break: break-word;
    line-height: 1.55;
  }
  .cmd-line .comment { color: var(--ink-faint); }

  .row-title {
    font-size: 0.8rem;
    color: var(--ink-dim);
    margin-top: 0.4rem;
  }
  .row-title .tool {
    color: var(--amber);
    font-family: 'JetBrains Mono', monospace;
    font-weight: 500;
  }

  .copy-btn {
    flex-shrink: 0;
    width: 3rem;
    border: none;
    border-left: 1px solid var(--line-soft);
    background: transparent;
    color: var(--ink-faint);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    cursor: pointer;
    transition: all 0.12s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .copy-btn:hover { background: var(--bg-hover); color: var(--amber); }
  .copy-btn.copied { color: var(--match); }

  /* expandable detail */
  .detail {
    display: none;
    padding: 0 1rem 0.9rem;
    border-top: 1px solid var(--line-soft);
    margin-top: -1px;
  }
  .row.open .detail { display: block; padding-top: 0.8rem; }

  .detail p { font-size: 0.83rem; color: var(--ink-dim); margin-bottom: 0.6rem; }
  .detail .out-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem;
    color: var(--ink-faint);
    display: block;
    margin-bottom: 0.2rem;
  }
  .detail .out {
    font-size: 0.8rem;
    color: var(--ink-dim);
    border-left: 2px solid var(--line);
    padding-left: 0.7rem;
  }
  .detail .tags {
    margin-top: 0.7rem;
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem;
  }
  .detail .tags span {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem;
    color: var(--ink-faint);
    background: var(--bg);
    border: 1px solid var(--line-soft);
    border-radius: 4px;
    padding: 0.1rem 0.45rem;
  }

  mark {
    background: transparent;
    color: var(--match);
    font-weight: 700;
  }

  /* ---------- Empty state ---------- */
  .empty {
    text-align: center;
    padding: 4rem 1rem;
    display: none;
  }
  .empty.show { display: block; }
  .empty .face {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.4rem;
    color: var(--amber);
    margin-bottom: 0.6rem;
  }
  .empty p { color: var(--ink-dim); font-size: 0.9rem; }
  .empty code {
    font-family: 'JetBrains Mono', monospace;
    color: var(--ink);
    background: var(--bg-raised);
    padding: 0.1rem 0.4rem;
    border-radius: 4px;
    border: 1px solid var(--line-soft);
  }

  /* ---------- Toast ---------- */
  #toast {
    position: fixed;
    bottom: 1.5rem;
    left: 50%;
    transform: translateX(-50%) translateY(150%);
    background: var(--amber);
    color: var(--bg);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.82rem;
    font-weight: 500;
    padding: 0.6rem 1.1rem;
    border-radius: var(--radius);
    transition: transform 0.22s cubic-bezier(0.2,0.8,0.2,1);
    z-index: 50;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  #toast.show { transform: translateX(-50%) translateY(0); }

  /* ---------- Footer hint ---------- */
  .kbhint {
    max-width: 1080px;
    margin: 1.5rem auto 0;
    padding: 1rem 1.5rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    color: var(--ink-faint);
    border-top: 1px solid var(--line-soft);
    display: flex;
    gap: 1.4rem;
    flex-wrap: wrap;
  }
  .kbhint kbd {
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 0.05rem 0.4rem;
    color: var(--ink-dim);
    margin-right: 0.3rem;
  }

  @media (max-width: 600px) {
    .head-inner { padding: 1rem 1rem 1.1rem; }
    main { padding: 1.25rem 1rem 0; }
    .brand .tag { display: none; }
    .kbhint { display: none; }
    #search { font-size: 1rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; scroll-behavior: auto; }
  }
</style>
</head>
<body>

<header>
  <div class="head-inner">
    <div class="brand">
      <img class="logo" src="assets/arsenal-mark.png" alt="Arsenal logo" width="34" height="34">
      <span class="prompt">arsenal</span>
      <span class="cursor" aria-hidden="true"></span>
      <span class="tag">offensive-security command reference</span>
    </div>
    <div class="search-wrap">
      <span class="glyph" aria-hidden="true">&gt;</span>
      <input
        id="search"
        type="text"
        placeholder="search command, tool or task…  (e.g. kerberoast, suid, azure)"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
        aria-label="Search commands">
      <span class="search-meta" id="meta"></span>
    </div>
    <div class="filters" id="filters" role="group" aria-label="Filter by category"></div>
  </div>
</header>

<main id="results"></main>

<div class="empty" id="empty">
  <div class="face">~ no matches ~</div>
  <p>Nothing for that query. Try a tool name, a technique, or clear the search with <code>Esc</code>.</p>
</div>

<div class="kbhint">
  <span><kbd>/</kbd>focus search</span>
  <span><kbd>↑</kbd><kbd>↓</kbd>move</span>
  <span><kbd>Enter</kbd>copy command</span>
  <span><kbd>Space</kbd>expand details</span>
  <span><kbd>Esc</kbd>clear</span>
</div>

<div id="toast" role="status" aria-live="polite">copied to clipboard</div>

<script>
// Category labels and their order are loaded from the manifest
// (data/categories.json), so adding a category never means editing this file.
let CATEGORY_LABELS = {};
let CATEGORY_ORDER = [];

let DATA = [];
let activeCategory = 'all';
let query = '';
let kbIndex = -1;   // keyboard-focused visible row

const $results = document.getElementById('results');
const $search  = document.getElementById('search');
const $meta    = document.getElementById('meta');
const $empty   = document.getElementById('empty');
const $filters = document.getElementById('filters');
const $toast   = document.getElementById('toast');

// ---------- Load data ----------
// A small manifest (data/categories.json) lists the categories, their display
// labels and their order. Each category lives in its own data/<category>.json
// file: an array of command objects with no "category" field, because the file
// *is* the category. To add commands, edit one category file. To add a category,
// add a line to the manifest and drop in a new file. This HTML stays untouched.
fetch('data/categories.json')
  .then(r => {
    if (!r.ok) throw new Error('categories.json HTTP ' + r.status);
    return r.json();
  })
  .then(manifest => {
    const cats = (manifest && manifest.categories) || [];
    CATEGORY_ORDER = cats.map(c => c.slug);
    CATEGORY_LABELS = {};
    cats.forEach(c => { CATEGORY_LABELS[c.slug] = c.label || c.slug; });
    // Fetch every category file in parallel; a broken/missing one is skipped
    // (logged) rather than taking the whole page down.
    return Promise.all(cats.map(c =>
      fetch('data/' + (c.file || (c.slug + '.json')))
        .then(r => {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        })
        .then(items => items.map(it => ({ ...it, category: c.slug })))
        .catch(err => {
          console.warn('Skipping category "' + c.slug + '":', err);
          return [];
        })
    ));
  })
  .then(groups => {
    const data = groups.flat();
    DATA = data.map((d, i) => ({ ...d, _id: i, _blob: buildBlob(d) }));
    buildFilters();
    render();
  })
  .catch(err => {
    $results.innerHTML =
      '<div class="empty show"><div class="face">~ load error ~</div>' +
      '<p>Could not read <code>data/categories.json</code>. ' +
      'If you opened this file directly, run a local server instead: ' +
      '<code>python3 -m http.server</code></p></div>';
    console.error(err);
  });

function buildBlob(d) {
  return [d.title, d.tool, d.command, d.description, d.category,
          (d.tags || []).join(' '), CATEGORY_LABELS[d.category] || '']
         .join(' ').toLowerCase();
}

// ---------- Filters ----------
function buildFilters() {
  const cats = CATEGORY_ORDER.filter(c => DATA.some(d => d.category === c));
  const mk = (val, label) => {
    const b = document.createElement('button');
    b.className = 'chip';
    b.textContent = label;
    b.dataset.cat = val;
    b.setAttribute('aria-pressed', val === activeCategory);
    b.addEventListener('click', () => {
      activeCategory = val;
      [...$filters.children].forEach(c =>
        c.setAttribute('aria-pressed', c.dataset.cat === val));
      render();
    });
    return b;
  };
  $filters.appendChild(mk('all', 'all'));
  cats.forEach(c => $filters.appendChild(mk(c, CATEGORY_LABELS[c])));
}

// ---------- Escape + highlight ----------
function esc(s) {
  return s.replace(/[&<>"']/g, m => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[m]));
}
function highlight(text, q) {
  const safe = esc(text);
  if (!q) return safe;
  const terms = q.split(/\s+/).filter(Boolean)
                 .map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  if (!terms.length) return safe;
  return safe.replace(new RegExp('(' + terms.join('|') + ')', 'gi'),
                      '<mark>$1</mark>');
}
// render a command, keeping shell comments dim, with highlight
function renderCommand(cmd, q) {
  return cmd.split('\n').map(line => {
    if (line.trimStart().startsWith('#')) {
      return '<span class="comment">' + highlight(line, q) + '</span>';
    }
    return highlight(line, q);
  }).join('\n');
}

// ---------- Match ----------
function matches(d) {
  if (activeCategory !== 'all' && d.category !== activeCategory) return false;
  if (!query) return true;
  return query.split(/\s+/).filter(Boolean).every(t => d._blob.includes(t));
}

// ---------- Render ----------
function render() {
  const q = query.trim().toLowerCase();
  const visible = DATA.filter(matches);
  kbIndex = -1;

  $meta.textContent = visible.length
    ? visible.length + (visible.length === 1 ? ' result' : ' results')
    : '';

  if (!visible.length) {
    $results.innerHTML = '';
    $empty.classList.add('show');
    return;
  }
  $empty.classList.remove('show');

  const groups = {};
  visible.forEach(d => (groups[d.category] ||= []).push(d));

  let html = '';
  CATEGORY_ORDER.forEach(cat => {
    const items = groups[cat];
    if (!items || !items.length) return;
    html += '<section class="cat-group">';
    html += '<div class="cat-head"><h2>' + esc(CATEGORY_LABELS[cat]) +
            '</h2><span class="count">' + items.length + '</span></div>';
    items.forEach(d => {
      html += rowHTML(d, q);
    });
    html += '</section>';
  });
  $results.innerHTML = html;
  wireRows();
}

function rowHTML(d, q) {
  const tags = (d.tags || []).map(t =>
    '<span>' + highlight(t, q) + '</span>').join('');
  return `
  <div class="row" data-id="${d._id}" tabindex="-1">
    <div class="row-main">
      <div class="cmd-block" data-role="toggle">
        <div class="cmd-line">${renderCommand(d.command, q)}</div>
        <div class="row-title"><span class="tool">${highlight(d.tool, q)}</span> — ${highlight(d.title, q)}</div>
      </div>
      <button class="copy-btn" data-role="copy" aria-label="Copy command" title="Copy">cp</button>
    </div>
    <div class="detail">
      <p>${highlight(d.description, q)}</p>
      <span class="out-label">expected output</span>
      <div class="out">${highlight(d.output, q)}</div>
      <div class="tags">${tags}</div>
    </div>
  </div>`;
}

// ---------- Row interactions ----------
function wireRows() {
  $results.querySelectorAll('.row').forEach(row => {
    const id = +row.dataset.id;
    const d = DATA.find(x => x._id === id);

    row.querySelector('[data-role="toggle"]')
       .addEventListener('click', () => row.classList.toggle('open'));

    row.querySelector('[data-role="copy"]')
       .addEventListener('click', e => {
         e.stopPropagation();
         copyCommand(d.command, e.currentTarget);
       });
  });
}

function copyCommand(cmd, btn) {
  // strip comment lines so only runnable commands land on the clipboard
  const clean = cmd.split('\n')
                   .filter(l => !l.trimStart().startsWith('#'))
                   .join('\n').trim();
  const done = () => {
    showToast();
    if (btn) {
      btn.classList.add('copied');
      const old = btn.textContent;
      btn.textContent = 'ok';
      setTimeout(() => { btn.classList.remove('copied'); btn.textContent = old; }, 1100);
    }
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(clean).then(done).catch(() => fallbackCopy(clean, done));
  } else {
    fallbackCopy(clean, done);
  }
}
function fallbackCopy(text, cb) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); cb(); } catch (e) {}
  document.body.removeChild(ta);
}

let toastTimer;
function showToast() {
  $toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $toast.classList.remove('show'), 1400);
}

// ---------- Search input ----------
$search.addEventListener('input', e => {
  query = e.target.value;
  render();
});

// ---------- Keyboard navigation ----------
function visibleRows() {
  return [...$results.querySelectorAll('.row')];
}
function setKb(idx) {
  const rows = visibleRows();
  rows.forEach(r => r.classList.remove('kb-active'));
  if (idx < 0 || idx >= rows.length) { kbIndex = -1; return; }
  kbIndex = idx;
  const el = rows[idx];
  el.classList.add('kb-active');
  el.scrollIntoView({ block: 'nearest' });
}

document.addEventListener('keydown', e => {
  // "/" focuses search from anywhere
  if (e.key === '/' && document.activeElement !== $search) {
    e.preventDefault();
    $search.focus();
    $search.select();
    return;
  }
  if (e.key === 'Escape') {
    if (query) { query = ''; $search.value = ''; render(); }
    $search.blur();
    setKb(-1);
    return;
  }

  const rows = visibleRows();
  if (!rows.length) return;

  if (e.key === 'ArrowDown') {
    e.preventDefault();
    setKb(kbIndex < rows.length - 1 ? kbIndex + 1 : 0);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    setKb(kbIndex > 0 ? kbIndex - 1 : rows.length - 1);
  } else if (e.key === 'Enter' && kbIndex >= 0) {
    e.preventDefault();
    const d = DATA.find(x => x._id === +rows[kbIndex].dataset.id);
    copyCommand(d.command, rows[kbIndex].querySelector('[data-role="copy"]'));
  } else if (e.key === ' ' && kbIndex >= 0 && document.activeElement !== $search) {
    e.preventDefault();
    rows[kbIndex].classList.toggle('open');
  }
});

// focus search on load for immediate typing
window.addEventListener('load', () => $search.focus());
</script>
</body>
</html>
